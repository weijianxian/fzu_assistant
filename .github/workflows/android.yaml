name: Android Build

on:
  workflow_call:
    secrets:
      KEY_STORE_PASSWORD:
        required: true
      KEY_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true
      KEYSTORE_BASE64:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" >> android/app/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/app/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/app/key.properties
          echo "storeFile=ghaction-keystore.jks" >> android/app/key.properties
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/ghaction-keystore.jks

      - name: Read version from pubspec
        id: version
        shell: bash
        run: |
          RAW=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1 | tr -d '[:space:]')
          echo "VERSION=${RAW%%+*}" >> "$GITHUB_OUTPUT"

      - name: Build split APKs
        run: flutter build apk --split-per-abi --release

      # Upload before the universal build replaces AGP's release output directory.
      - name: Upload Android armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: FZU-assistant-v${{ steps.version.outputs.VERSION }}-android-armeabi-v7a
          path: build/app/outputs/apk/release/FZU-assistant-v*-android-armeabi-v7a.apk
          compression-level: 0
          if-no-files-found: error

      - name: Upload Android arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: FZU-assistant-v${{ steps.version.outputs.VERSION }}-android-arm64-v8a
          path: build/app/outputs/apk/release/FZU-assistant-v*-android-arm64-v8a.apk
          compression-level: 0
          if-no-files-found: error

      - name: Upload Android x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: FZU-assistant-v${{ steps.version.outputs.VERSION }}-android-x86_64
          path: build/app/outputs/apk/release/FZU-assistant-v*-android-x86_64.apk
          compression-level: 0
          if-no-files-found: error

      - name: Build universal APK
        run: flutter build apk --release

      - name: Upload Android universal APK
        uses: actions/upload-artifact@v4
        with:
          name: FZU-assistant-v${{ steps.version.outputs.VERSION }}-android-universal
          path: build/app/outputs/apk/release/FZU-assistant-v*-android-universal.apk
          compression-level: 0
          if-no-files-found: error

