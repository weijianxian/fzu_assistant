name: Check

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          cache: true

      - name: Test Git hooks
        run: python3 scripts/test_git_hooks.py

      - name: Get dependencies
        run: flutter pub get

      - name: Install native window build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libgtk-3-dev libx11-dev libxi-dev

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        if: ${{ !cancelled() }}
        run: flutter analyze --no-pub lib test

      - name: Test
        if: ${{ !cancelled() }}
        run: flutter test --no-pub
