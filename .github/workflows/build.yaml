name: Build and Release

permissions:
  contents: write
  actions: read

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-windows:
    uses: ./.github/workflows/windows.yaml

  build-android:
    uses: ./.github/workflows/android.yaml
    secrets:
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

  build-apple:
    uses: ./.github/workflows/apple.yaml

  build-linux:
    uses: ./.github/workflows/linux.yaml

  release:
    needs: [build-windows, build-android, build-apple, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          pattern: FZU-assistant-*-windows-*-installer
          path: artifacts
          merge-multiple: true

      - name: Download Android packages
        uses: actions/download-artifact@v4
        with:
          pattern: FZU-assistant-*-android-*
          path: artifacts
          merge-multiple: true

      - name: Download macOS packages
        uses: actions/download-artifact@v4
        with:
          pattern: FZU-assistant-*-macos-*
          path: artifacts
          merge-multiple: true

      - name: Download iOS packages
        uses: actions/download-artifact@v4
        with:
          pattern: FZU-assistant-*-ios-*
          path: artifacts
          merge-multiple: true

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          pattern: FZU-assistant-*-linux-*
          path: artifacts
          merge-multiple: true

      # Reuse upload-artifact's ZIP directly, without repackaging the bundle.
      - name: Download portable artifact archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p release-assets
          gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name | endswith("-windows-x86_64-portable")) | [.id, .name] | @tsv' > portable-artifacts.tsv
          test "$(wc -l < portable-artifacts.tsv)" -eq 1
          while IFS=$'\t' read -r ID NAME; do
            gh api "repos/${{ github.repository }}/actions/artifacts/$ID/zip" > "release-assets/$NAME.zip"
          done < portable-artifacts.tsv

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.cliff.outputs.content }}
          fail_on_unmatched_files: true
          files: |
            release-assets/FZU-assistant-v*-windows-x86_64-portable.zip
            artifacts/FZU-assistant-v*-windows-x86_64-installer.exe
            artifacts/FZU-assistant-v*-android-*.apk
            artifacts/FZU-assistant-v*-macos-*.dmg
            artifacts/FZU-assistant-v*-ios-*.ipa
            artifacts/FZU-assistant-v*-linux-*.tar.gz
